[project]
name = "network-intrusion-detection-system"
version = "0.1.0"
description = "Detecting network attacks compared to baseline activity: port scanning, DDoS/SYN flood, brute force, DNS exfiltration, normal baseline."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastparquet>=2026.5.0",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "pyarrow>=24.0.0",
    "pyyaml>=6.0.3",
    "tqdm>=4.67.3",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
]
